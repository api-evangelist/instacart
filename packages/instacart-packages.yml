findings:
  - >-
    Zero first-party API SDKs against an API surface of roughly two dozen documented operations across
    five products. For agent consumers this is partly mitigated by the MCP server, which is arguably
    Instacart's SDK substitute for the Developer Platform - but it covers only 2 of those operations.
  - >-
    Every first-party package in any registry predates 2023. The newest official Instacart publication
    found anywhere was ic-snacks in February 2022, more than four years before this probe. The API
    surface, by contrast, changed as recently as June 2026.
