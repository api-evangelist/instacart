description: >-
  Instacart publishes NO first-party client library for any of its APIs. Not for the Developer
  Platform API, not for the Connect APIs, not for the Catalog or Carrot Ads APIs, and not for the MCP
  server. Every integration path in the documentation is a raw HTTP call - the endpoint reference
  ships cURL, Java, Python and Go request examples inline rather than SDK snippets, and the docs
  say developers "can integrate the selected capabilities through REST API calls using any language".
  The @instacart/* namespace on npm is real and first-party, but it holds internal front-end
  engineering tooling from 2019-2022, none of which calls an Instacart API. The only shipped client
  artifact is the Shopping Widgets UMD bundle, and it is distributed per-retailer from a CloudFront
  path with no registry and no version pin.
