description: 'Entity graph derived from the $ref links and id-reference fields in Instacart''s published
  contracts. The graph is shallow by design: Instacart''s APIs are workflow-shaped rather than resource-shaped,
  so the strong nouns are Order, Item, Store and ServiceOption, and most requests carry composites inline
  rather than by reference. Identifiers are opaque strings with no published prefix scheme - unlike a
  payments API, you cannot tell an order ID from a user ID by looking at it - and user_id is retailer-generated
  (any unique identifier: login name, loyalty ID, email address), which makes it the one join key an integrator
  controls.'
