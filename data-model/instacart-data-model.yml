identifiers:
  scheme: opaque strings
  prefixes_published: false
  notes:
  - user_id is generated by the retailer and may be any unique identifier such as a login name, loyalty
    ID or email address.
  - order_id is generated by Instacart and used as a path parameter across Fulfillment and Post-checkout.
  - API keys carry the prefix "keys." followed by 32 hex characters; that is the only published identifier
    prefix in the surface.
