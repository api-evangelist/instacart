    site. graphql/instacart-schema.graphql and graphql/instacart-graphql.md are API Evangelist modelling
    artifacts that label themselves 'conceptual schema'; they are kept in the repo as analysis but are
    no longer wired as a contract pointer, because a GraphQL pointer asserts on Instacart's behalf that
    they serve one.
