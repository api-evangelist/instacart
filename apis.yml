description: 'Instacart (Maplebear Inc.) is a North American grocery technology company that operates
  the Instacart Marketplace and sells its underlying commerce, fulfillment, catalog, advertising and storefront
  technology to retailers and brands. Its published API surface splits cleanly in two. The Instacart Developer
  Platform API is open to app and website developers, costs nothing, and exposes two shoppable-page operations
  plus a nearby-retailers lookup at connect.instacart.com/idp/v1 -- and, unusually, Instacart pays the
  developer, commissioning attributed orders through an Impact affiliate programme. Instacart Connect
  is the enterprise half: OAuth 2.0, partner-gated Fulfillment, Post-checkout, Transaction and Sandbox
  APIs, the Catalog API, Carrot Ads and Shopping Widgets, all bundled into a retailer or brand partner
  agreement. Instacart also runs a first-party remote Model Context Protocol server at https://mcp.instacart.com/mcp
  whose tools/list is served anonymously, making it one of the few grocery-sector providers with a directly
  reachable agent surface.'
