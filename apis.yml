  name: Instacart Developer Platform MCP Server
  description: >-
    Instacart's first-party remote Model Context Protocol server. Production endpoint https://mcp.instacart.com/mcp
    over Streamable HTTP, authenticated with a Developer Platform API key as an Authorization Bearer header;
    a development endpoint runs at https://mcp.dev.instacart.tools/mcp. Both answered an anonymous tools/list
    with HTTP 200 on 2026-08-27, returning the create-recipe and create-shopping-list tools with full
    JSON Schema inputs. A separate, endpoint-undisclosed Enterprise MCP server covering store availability,
    ingredient lookup and order assembly is documented but gated behind an Instacart representative.
  humanURL: https://docs.instacart.com/developer_platform_api/guide/tutorials/mcp
