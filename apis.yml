- aid: instacart:shopping-widgets
  name: Instacart Shopping Widgets
  tags:
  - Embedding
  - Retail
  - Shopping
  - Web Components
  - Widgets
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://dboktu48tbzl9.cloudfront.net/{retailer-name}/evergreen
  humanURL: https://docs.instacart.com/widgets/
  properties:
  - url: https://docs.instacart.com/widgets/
    type: Documentation
  - type: Components
    url: components/instacart-components.yml
  - type: ChangeLog
    url: https://docs.instacart.com/widgets/changelog
  - type: GettingStarted
    url: https://docs.instacart.com/widgets/guide/tutorials/get_started_with_prebuilt_widgets
  description: >-
    Instacart Shopping Widgets are front-end web components that retailers can embed into their websites
    to add e-commerce functionalities powered by Instacart without interacting with any API directly.
    The widgets enable features such as product search results, cart management, product collections,
    and user authentication.
  x-base-url-note: >-
    Shopping Widgets are front-end web components, not an API: Instacart's own documentation says they
    add e-commerce capability 'without having to interact with any API directly'. The only host a retailer
    actually calls is the CloudFront path that serves the per-retailer UMD bundle (ic-widgets-v1.umd.js),
    which is templated on the retailer name and issued at sign-up. Recorded here in place of the api.example.com
    placeholder that was previously carried. Custom widgets, by contrast, call the Developer Platform
    Partner API documented on the partner-gated host partner-docs.instacart.com.
