      docs: https://docs.instacart.com/connect/api/fulfillment/lastmile/cancel_order
    - operation: Create a last mile delivery order (lastmile URI)
      replacement: Create a last mile delivery order (last_mile URI)
      docs: https://docs.instacart.com/connect/api/fulfillment/lastmile/create_order
    - operation: Reserve a time slot for last mile delivery (lastmile URI)
      replacement: Reserve a time slot (shared endpoint)
    - operation: Create a user and validate an address (lastmile URI)
      replacement: Create a Connect user and validate an address
    - operation: Find stores offering last mile delivery (lastmile URI)
      replacement: Find stores offering last mile delivery (last_mile URI)
    - operation: Get a last mile delivery order (lastmile URI)
      replacement: Get an order (shared endpoint)
    - operation: List time slots for last mile delivery (lastmile URI)
      replacement: List time slots / Preview time slots for last mile delivery
    - operation: Stage a last mile delivery order (lastmile URI)
      replacement: Stage a last mile delivery order (last_mile URI)
    - operation: Update a last mile delivery order (lastmile URI)
