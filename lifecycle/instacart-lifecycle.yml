provider: Instacart
providerId: instacart
description: >-
  Instacart runs a documented, conservative API lifecycle: URI-path versioning, additive-only changes,
  dated per-product changelogs, a named minimum six-month deprecation window, and a dedicated page
  where retired endpoints are parked rather than deleted. The one gap is runtime signalling - none of
  the deprecation posture is expressed in HTTP headers (no RFC 8594 Sunset, no Deprecation header) or
  in the OpenAPI, so a client learns about a deprecation only by reading the changelog.
versioning:
  scheme: uri-path
  current:
    - api: Instacart Developer Platform API
      version: v1
      path_prefix: /idp/v1/
    - api: Instacart Connect APIs
      version: v2
      path_prefix: /v2/
    - api: LLM integration recipes endpoint
      version: v2.1
      path_prefix: /rest/llm_integration/openapi/v2_1/
      host: www.instacart.com
  header_negotiation: false
  compatibility: >-
    Additive and backward compatible. New fields are optional. Every published changelog states that
    the changes it lists are non-breaking.
deprecation:
  policy_published: true
  policy_url: https://docs.instacart.com/connect/api/fulfillment/deprecated
  minimum_notice: 6 months
  policy_text: >-
    "When the Instacart Connect team deprecates endpoints, we announce the deprecation in the
    changelog and then move the endpoints to this location. Deprecated endpoints remain supported for
    a minimum of six months but might be removed in the future."
  announcement_channel: product changelog
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  runtime_signal: >-
    None. Deprecation is documentation-only; no Sunset or Deprecation response header is documented,
    and no `deprecated: true` flag appears in the harvested OpenAPI definitions.
  deprecated_operations:
    - operation: Reserve a previewed time slot
