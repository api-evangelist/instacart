description: >-
  Instacart maintains eight separate dated changelogs, one per product surface, all reachable from
  docs.instacart.com and all reverse-chronological. Every one of them states that the changes listed
  are non-breaking. The entries below are the recent window from the Developer Platform and MCP
  changelogs - the two surfaces an outside developer can reach without a partner agreement.
scheme: dated-entries
versioning: uri-path (see lifecycle/instacart-lifecycle.yml)
breaking_change_policy: >-
  Additive only. Deprecated endpoints and fields are announced in the changelog and remain supported
  for a minimum of six months.
